
[functions.create-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/create-checkout/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-checkout/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-checkout/*.html" ]

[functions.payment-redirect]
enabled = true
verify_jwt = false
import_map = "./functions/payment-redirect/deno.json"
entrypoint = "./functions/payment-redirect/index.ts"

[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"

[functions.check-stripe-status]
enabled = true
verify_jwt = false
# JWT is verified manually in-function via supabase.auth.getUser(token)
entrypoint = "./functions/check-stripe-status/index.ts"

[functions.create-stripe-account]
enabled = true
verify_jwt = false
# JWT is verified manually in-function via supabase.auth.getUser(token)
entrypoint = "./functions/create-stripe-account/index.ts"
